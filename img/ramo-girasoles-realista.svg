<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86D76F"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3EA7F"/>
      <stop offset="1" stop-color="#3B8F3D"/>
    </linearGradient>
    <radialGradient id="centerGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(52)">
      <stop offset="0" stop-color="#78511A"/>
      <stop offset="0.52" stop-color="#56350E"/>
      <stop offset="1" stop-color="#2A1808"/>
    </radialGradient>
    <radialGradient id="petalGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(62)">
      <stop offset="0" stop-color="#FFF4A9"/>
      <stop offset="0.55" stop-color="#F5CF4E"/>
      <stop offset="1" stop-color="#D99A2D"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#8B5C12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
